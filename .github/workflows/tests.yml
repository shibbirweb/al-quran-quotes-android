name: Tests

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests, coverage check, lint, and release build
        run: >-
          ./gradlew --continue testDebugUnitTest koverVerifyDebug koverXmlReportDebug
          koverHtmlReportDebug lintDebug assembleRelease

      - name: Summarize unit test coverage
        if: always()
        run: >-
          python3 .github/scripts/coverage_summary.py "Unit test coverage (Kover)"
          "app/build/reports/kover/reportDebug.xml"

      - name: Upload unit test coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-coverage
          path: app/build/reports/kover/

      - name: Upload unit test, coverage, and lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/kover/
            app/build/reports/lint-results-debug.html

  instrumented-tests:
    name: Instrumented tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache the emulator snapshot
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          # Bump the leading version to force a fresh snapshot after emulator or image changes.
          key: avd-v1-api-35-google_apis-x86_64

      - name: Create the emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Created the emulator snapshot."

      - name: Run instrumented tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew createDebugCoverageReport

      - name: Summarize device test coverage
        if: always()
        run: >-
          python3 .github/scripts/coverage_summary.py "Device test coverage (JaCoCo)"
          "app/build/reports/coverage/androidTest/debug/**/report.xml"

      - name: Upload device test coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: device-test-coverage
          path: app/build/reports/coverage/androidTest/

      - name: Upload instrumented test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
